services:
    nginx:
        image: nginx:stable-alpine
        container_name: educore-nginx
        ports:
            - "80:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
        networks:
            - educore

    php:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: educore-php
        environment:
            - XDEBUG_MODE=debug
            - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003 idekey=docker
            - PHP_IDE_CONFIG=serverName=educore.local
        volumes:
            - ./:/var/www/html
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
            - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
        depends_on:
            - redis
            - mysql
        networks:
            - educore
        extra_hosts:
            - "host.docker.internal:host-gateway"
        user: "1000:1000"

    redis:
        image: redis:alpine
        container_name: educore-redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - educore

    mysql:
        image: mysql:8.0
        container_name: educore-mysql
        restart: always
        environment:
            MYSQL_DATABASE: educore
            MYSQL_USER: educore
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: secret_root
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - educore
        extra_hosts:
            - "host.docker.internal:host-gateway"

    mysql_testing:
        image: mysql:8.0
        container_name: educore-mysql-testing
        restart: always
        environment:
            MYSQL_DATABASE: educore_testing
            MYSQL_USER: educore_testing
            MYSQL_PASSWORD: secret_testing
            MYSQL_ROOT_PASSWORD: secret_root_testing
        ports:
            - "3307:3306"
        volumes:
            - mysql_testing_data:/var/lib/mysql
        networks:
            - educore
        extra_hosts:
            - "host.docker.internal:host-gateway"

volumes:
    redis_data:
    mysql_data:
    mysql_testing_data:

networks:
    educore:
        driver: bridge
